[project]
name = "vf-test-fixtures"
version = "0.0.0"
description = "integration test fixture tasksets — packaged so a sandbox runtime can install just this dir (its own pyproject) instead of climbing to the repo root."
requires-python = ">=3.10"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat fixture modules whose tool servers self-launch in a sandbox (docker/prime) and so must
# be importable there. The others (e.g. echo, echo_user_sim) have no server, so they
# never get installed.
[tool.hatch.build]
include = [
    "agent_user.py",
    "counter_tool.py",
    "echo_acp_resume.py",
    "echo_tool.py",
    "fetch_tool.py",
    "tool_response_image.py",
    "pyproject.toml",
]
