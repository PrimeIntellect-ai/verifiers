[project]
name = "proposer-solver"
version = "0.1.0"
description = "proposer-solver — a proposer invents verified math problems; n solvers race them (showcases heterogeneous seats + cross-agent rewards)."
requires-python = ">=3.10"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proposer_solver"]
