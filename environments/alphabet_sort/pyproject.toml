[project]
name = "alphabet-sort"
version = "0.1.0"
description = "alphabet-sort — maintain an alphabetically sorted list of names across turns, driven by a colocated user simulator."
requires-python = ">=3.11"
dependencies = ["verifiers", "datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphabet_sort"]
