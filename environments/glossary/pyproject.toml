[project]
name = "glossary"
version = "0.1.0"
description = "glossary — task-specific tools via a vf-native Toolset class."
requires-python = ">=3.10"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glossary"]

