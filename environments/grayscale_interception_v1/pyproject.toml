[project]
name = "grayscale-interception-v1"
version = "0.1.0"
description = "Rewrite inline user images to grayscale before the model sees them."
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3.0",
    "verifiers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grayscale_interception_v1"]
