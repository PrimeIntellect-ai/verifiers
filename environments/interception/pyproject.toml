[project]
name = "interception"
version = "0.1.0"
description = "Examples of typed response interception, stopping, and metrics."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["interception"]
