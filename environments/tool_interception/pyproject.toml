[project]
name = "tool-interception"
version = "0.1.0"
description = "Block tools and rewrite completed results before the agent sees them."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tool_interception"]
