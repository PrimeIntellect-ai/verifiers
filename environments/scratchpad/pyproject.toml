[project]
name = "scratchpad"
version = "0.1.0"
description = "scratchpad — a shared, writable tool server, per-rollout isolated via self.state."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scratchpad"]
