[project]
name = "web-search-interception-v1"
version = "0.1.0"
description = "Terminate on blocked content in Codex-native web-search events."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web_search_interception_v1"]
