[project]
name = "swarm-smoke"
version = "0.1.0"
description = "Verify isolated agents collaborating through a persistent world."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm_smoke"]
