[project]
name = "color-codeword"
version = "0.1.0"
description = "color-codeword — a multi-turn VLM codeword-decoding task, driven by a colocated user simulator."
requires-python = ">=3.10"
dependencies = ["verifiers", "pillow>=11.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["color_codeword"]
