[project]
name = "swarm-coordination"
version = "0.1.0"
description = "Four solvers and a coordinator with commit-bound unanimous submission."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm_coordination"]
