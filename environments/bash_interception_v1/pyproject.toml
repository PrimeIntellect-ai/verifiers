[project]
name = "bash-interception-v1"
version = "0.1.0"
description = "Block or rewrite Bash tool exchanges."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bash_interception_v1"]
