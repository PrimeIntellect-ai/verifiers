# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Redirect to new docs at docs.primeintellect.ai/verifiers
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - |
      cat > "$READTHEDOCS_OUTPUT/html/index.html" <<'EOF'
      <!DOCTYPE html>
      <html lang="en">
      <head>
          <meta charset="UTF-8">
          <meta http-equiv="refresh" content="0; url=https://docs.primeintellect.ai/verifiers">
          <link rel="canonical" href="https://docs.primeintellect.ai/verifiers">
          <title>Redirecting to Verifiers Documentation</title>
      </head>
      <body>
          <p>Verifiers is a library of modular components for creating train-ready RL environments and evaluations.</p>
          <p>The documentation has moved to <a href="https://docs.primeintellect.ai/verifiers">docs.primeintellect.ai/verifiers</a>.</p>
          <p>You should be redirected automatically. If not, <a href="https://docs.primeintellect.ai/verifiers">click here</a>.</p>
      </body>
      </html>
      EOF
