name: Publish harness images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/harness/Dockerfile
      - .github/workflows/harness-image.yml

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - id: discover
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from verifiers.v1.configs.deployment import DOCKER_HARNESS_IMAGE_PREFIX
          from verifiers.v1.utils.loaders import builtin_harness_ids, load_harness, harness_config_type

          seen = {}
          for hid in builtin_harness_ids():
              h = load_harness(harness_config_type(hid)(id=hid))
              seen[h.harness_target] = h.harness_tag
          items = [
              {
                  "target": target,
                  "image": f"{DOCKER_HARNESS_IMAGE_PREFIX}-{target}:{tag}",
              }
              for target, tag in sorted(seen.items())
          ]
          print("matrix=" + json.dumps({"include": items}))
          PY

  publish:
    needs: targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/harness
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}
