name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "packages/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "packages/**"
      - ".github/workflows/test.yml"

env:
  HF_HOME: ${{ github.workspace }}/.cache/huggingface

permissions:
  contents: read

jobs:
  test:
    name: Verifiers
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache Hugging Face tokenizers
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-tokenizers-${{ runner.os }}-${{ hashFiles('uv.lock', 'tests/test_renderer_client.py', 'tests/test_renderer_e2e.py') }}
          restore-keys: |
            hf-tokenizers-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: |
          uv run pytest tests/ -v --ignore=tests/v1 -m "not prime" --cov=verifiers --cov-report=xml --cov-report=term

      - name: Run deterministic v1 tests
        run: |
          uv run pytest tests/v1 -vv -n auto -m "not e2e" --cov=verifiers --cov-append --cov-report=xml --cov-report=term

  v1-e2e:
    name: V1 live E2E (Python 3.12)
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
      PRIME_TEAM_ID: ${{ secrets.PRIME_TEAM_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache Hugging Face tokenizers
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-tokenizers-${{ runner.os }}-${{ hashFiles('uv.lock', 'tests/test_renderer_client.py', 'tests/test_renderer_e2e.py') }}
          restore-keys: |
            hf-tokenizers-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Run Kuhn Poker with RLM in Prime VMs
        run: |
          uv run eval kuhn-poker-v1 -m deepseek/deepseek-v4-flash-0731 -n 1 -r 1 -c 1 -o /tmp/kuhn-rlm-prime-e2e --no-push --no-rich --sampling.max-tokens 8192 --env.player0.harness.id rlm --env.player0.runtime.type prime --env.player0.runtime.vm true --env.player0.max-turns 8 --env.player0.max-output-tokens 8192 --env.player0.timeout.rollout 600 --env.player1.harness.id rlm --env.player1.runtime.type prime --env.player1.runtime.vm true --env.player1.max-turns 8 --env.player1.max-output-tokens 8192 --env.player1.timeout.rollout 600
          uv run python -c 'import json; from pathlib import Path; rows = [json.loads(line) for line in Path("/tmp/kuhn-rlm-prime-e2e/traces.jsonl").read_text().splitlines() if line.strip()]; assert len(rows) == 1, rows; row = rows[0]; traces = row["traces"]; assert row["ok"] and len(traces) == 2, row.get("errors"); assert all(t["ok"] and not t["errors"] and t["stop_condition"] == "user_closed" and t["info"]["kuhn"]["forfeited"] is None for t in traces), traces; assert sorted(t["agent"]["name"] for t in traces) == ["player0", "player1"]; assert sum(t["rewards"]["payoff"]["score"] for t in traces) == 0; print(json.dumps([{"agent": t["agent"]["name"], "card": t["info"]["kuhn"]["card"], "history": t["info"]["kuhn"]["history"], "turns": sum(bool(n.get("sampled")) for n in t["nodes"]), "payoff": t["rewards"]["payoff"]["score"]} for t in traces], indent=2))'

      - name: Run live v1 E2Es
        run: |
          uv run pytest tests/v1 -vv -n auto -m "e2e and not prime and not modal" --cov=verifiers --cov-report=xml --cov-report=term
