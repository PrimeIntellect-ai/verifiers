name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "packages/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "packages/**"
      - ".github/workflows/test.yml"

env:
  HF_HOME: ${{ github.workspace }}/.cache/huggingface

permissions:
  contents: read

jobs:
  test:
    name: Verifiers
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Cache Hugging Face tokenizers
        uses: actions/cache@v6
        with:
          path: ${{ env.HF_HOME }}
          key: hf-tokenizers-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            hf-tokenizers-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Run deterministic v1 tests
        run: |
          uv run pytest tests/v1 -vv -n auto -m "not e2e" --cov=verifiers --cov-report=xml --cov-report=term

  v1-e2e:
    name: V1 live E2E (Python 3.12, ${{ matrix.suite }})
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            selection: tests/v1 --ignore=tests/v1/test_envs.py -k "not test_acp_resume_with_tool"
          - suite: acp
            selection: tests/v1 --ignore=tests/v1/test_envs.py -k test_acp_resume_with_tool
          - suite: examples
            selection: tests/v1/test_envs.py
    env:
      PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
      PRIME_TEAM_ID: ${{ secrets.PRIME_TEAM_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Cache Hugging Face tokenizers
        uses: actions/cache@v6
        with:
          path: ${{ env.HF_HOME }}
          key: hf-tokenizers-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            hf-tokenizers-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Cache wiki-search index and embedding model
        if: matrix.suite == 'examples'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/wiki_search
            ~/.cache/chroma
          key: wiki-search-${{ runner.os }}-${{ hashFiles('uv.lock', 'environments/wiki_search/wiki_search/servers/wiki.py') }}

      - name: Run live v1 E2Es
        run: |
          uv run pytest ${{ matrix.selection }} -vv -n 4 --dist worksteal -m "e2e and not prime and not modal and not e2b" --cov=verifiers --cov-report=xml --cov-report=term --durations=25 --junitxml=test-results.xml

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v1-e2e-${{ matrix.suite }}-results
          path: test-results.xml

  delivery-behaviors:
    name: Nano-RLM delivery behaviors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install Verifiers and nano-rlm
        run: |
          uv sync
          uv tool install --python 3.12 'git+https://github.com/PrimeIntellect-ai/nano-rlm.git@c38e20b60c90bbf625274d3fde2b2a384f390a66'
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Run scripted delivery behaviors without model credentials
        env:
          VF_DELIVERY_BEHAVIORS: "1"
          VF_DELIVERY_OUTPUT: delivery-traces
        run: uv run pytest tests/v1/test_delivery_behaviors.py -k rlm -v -n 2
      - name: Upload timelines and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nano-rlm-delivery-traces
          path: delivery-traces/
